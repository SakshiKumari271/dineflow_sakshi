<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineFlow - Customers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="sidebar">
        <h2>DineFlow</h2>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="customers.html" class="active">Customers</a></li>
                <li><a href="revenue.html">Revenue</a></li>
            </ul>
        </nav>
    </aside>

    <header>
        <button id="sidebar-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--primary);">☰</button>
        <h1>Customer Directory</h1>
        <div class="user-actions">
            <input type="text" placeholder="Search...">
            <a href="login.html">Log out</a>
        </div>
    </header>

    <main>
        <section class="chart-section">
            <h2>Recent Regulars</h2>
            <ul style="list-style: none; margin-top: 16px;">
                <li style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem;">
                    <span><strong>Aman Sharma</strong></span>
                    <span style="color: #776B65;">12 Visits • ₹4,200 spent</span>
                </li>
                <li style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 0.9rem;">
                    <span><strong>Priya Verma</strong></span>
                    <span style="color: #776B65;">8 Visits • ₹2,600 spent</span>
                </li>
            </ul>
        </section>
    </main>

    <script>
        const toggleBtn = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    </script>
</body>
</html>
