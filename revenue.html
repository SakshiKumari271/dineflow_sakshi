<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineFlow - Revenue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="sidebar">
        <h2>DineFlow</h2>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="revenue.html" class="active">Revenue</a></li>
            </ul>
        </nav>
    </aside>

    <header>
        <button id="sidebar-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--primary);">☰</button>
        <h1>Revenue Reports</h1>
        <div class="user-actions">
            <input type="text" placeholder="Search...">
            <a href="login.html">Log out</a>
        </div>
    </header>

    <main>
        <div class="stats-grid" style="margin-bottom: 24px;">
            <div class="stat-card">
                <h3>Today's Revenue</h3>
                <p>₹45,230</p>
            </div>
            <div class="stat-card">
                <h3>Monthly Earnings</h3>
                <p>₹12,45,000</p>
            </div>
        </div>
        <section class="chart-section">
            <h2>Growth Overview</h2>
            <div class="chart-placeholder">
                <p>[ Detailed Revenue Graph ]</p>
            </div>
        </section>
    </main>

    <script>
        const toggleBtn = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    </script>
</body>
</html>
