<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineFlow - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <header class="login-header">
        <h1>DineFlow Portal</h1>
    </header>

    <main>
        <section class="login-card">
            <h2>Staff / Admin Login</h2>
            <form action="index.html" method="post">
                <!-- Normal Email Field -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Password Field with Error State (Bonus Requirement) -->
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" class="input-error" required>
                    <span class="error-message">Invalid password. Please try again.</span>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-primary">Login</button>
                </div>
            </form>
            <p><a href="index.html">Back to Dashboard</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DineFlow. All rights reserved.</p>
    </footer>

</body>
</html>
