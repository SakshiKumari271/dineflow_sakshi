<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineFlow - Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="sidebar">
        <h2>DineFlow</h2>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="orders.html" class="active">Orders</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="revenue.html">Revenue</a></li>
            </ul>
        </nav>
    </aside>

    <header>
        <button id="sidebar-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--primary);">☰</button>
        <h1>Manage Orders</h1>
        <div class="user-actions">
            <input type="text" placeholder="Search...">
            <a href="login.html">Log out</a>
        </div>
    </header>

    <main>
        <section class="chart-section" style="margin-bottom: 24px;">
            <h2>Active Table & Takeaway Orders</h2>
            <div style="overflow-x: auto; margin-top: 16px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; min-width: 500px;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border); color: #776B65;">
                            <th style="padding: 12px;">Order ID</th>
                            <th style="padding: 12px;">Customer</th>
                            <th style="padding: 12px;">Items</th>
                            <th style="padding: 12px;">Amount</th>
                            <th style="padding: 12px;">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid var(--border);">
                            <td style="padding: 12px; font-weight: 600;">#ORD-101</td>
                            <td style="padding: 12px;">Table 4</td>
                            <td style="padding: 12px;">Cold Coffee, Burger</td>
                            <td style="padding: 12px;">₹450</td>
                            <td style="padding: 12px;"><span style="color: #2E7D32; font-weight: 600;">Completed</span></td>
                        </tr>
                        <tr style="border-bottom: 1px solid var(--border);">
                            <td style="padding: 12px; font-weight: 600;">#ORD-102</td>
                            <td style="padding: 12px;">Rahul (Takeaway)</td>
                            <td style="padding: 12px;">Pasta</td>
                            <td style="padding: 12px;">₹320</td>
                            <td style="padding: 12px;"><span style="color: #1565C0; font-weight: 600;">Preparing</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const toggleBtn = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    </script>
</body>
</html>
